# Versión SIN SSL — usar solo para probar antes de certbot
# Renombrar/copiar como sites-available y comentar el bloque HTTPS del otro archivo

upstream quinlist_app {
    server 127.0.0.1:3012;
}

server {
    listen 80;
    listen [::]:80;
    server_name quinlist.matubyte.com QuinList.matubyte.com;

    location / {
        proxy_pass http://quinlist_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
