# QuinList — quinlist.matubyte.com
# Copiar a: /etc/nginx/sites-available/quinlist.matubyte.com
# Enlazar:  sudo ln -s /etc/nginx/sites-available/quinlist.matubyte.com /etc/nginx/sites-enabled/
# Probar:    sudo nginx -t && sudo systemctl reload nginx

upstream quinlist_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

# Redirigir HTTP → HTTPS (activar después de certbot)
server {
    listen 80;
    listen [::]:80;
    server_name quinlist.matubyte.com QuinList.matubyte.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quinlist.matubyte.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quinlist.matubyte.com QuinList.matubyte.com;

    # Certbot rellena estas rutas (sudo certbot --nginx -d quinlist.matubyte.com)
    ssl_certificate     /etc/letsencrypt/live/quinlist.matubyte.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quinlist.matubyte.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Ajusta si el proyecto no está en /var/www/quinlist
    root /var/www/quinlist/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Archivos estáticos del build (cache)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /backgrounds/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Proxy a PM2 (serve en puerto 3010) — SPA con history mode
    location / {
        proxy_pass http://quinlist_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
